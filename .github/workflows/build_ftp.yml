name: FTP upload

on:
  workflow_dispatch:
    inputs:
      zip_path:
        required: true
      chat_id:
        required: true
      host:
        required: true
      port:
        required: true
      login:
        required: true
      password:
        required: true

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ZIP_PATH: ${{ github.event.inputs.zip_path }}
      CHAT_ID: ${{ github.event.inputs.chat_id }}
      FTP_HOST: ${{ github.event.inputs.host }}
      FTP_PORT: ${{ github.event.inputs.port }}
      FTP_LOGIN: ${{ github.event.inputs.login }}
      FTP_PASSWORD: ${{ github.event.inputs.password }}
    steps:
      - uses: actions/checkout@v4
      - name: Mask secrets in logs
        run: |
          echo "::add-mask::${{ github.event.inputs.login }}"
          echo "::add-mask::${{ github.event.inputs.password }}"
      - name: Run FTP upload
        run: bash scripts/build_ftp.sh
