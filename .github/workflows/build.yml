name: Build NDK project

on:
  push:
    branches: [ builds ]
    paths:
      - 'uploads/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine uploaded file and chat_id
        id: info
        run: |
          FILE=$(git diff --name-only HEAD~1 HEAD -- uploads/ | head -n1)
          if [ -z "$FILE" ]; then
            FILE=$(git show --name-only --pretty="" HEAD -- uploads/ | head -n1)
          fi
          BASENAME=$(basename "$FILE")
          CHATID=$(echo "$BASENAME" | cut -d'_' -f1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "chatid=$CHATID" >> "$GITHUB_OUTPUT"

      - name: Notify compiling
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ steps.info.outputs.chatid }}" \
            -d text="Компилирую..."

      - name: Setup Android NDK r25c
        id: setup-ndk
        run: |
          curl -fsSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q ndk.zip -d "$HOME"
          echo "ndk-path=$HOME/android-ndk-r25c" >> "$GITHUB_OUTPUT"

      - name: Extract project
        run: |
          mkdir -p project
          if ! unzip -q "${{ steps.info.outputs.file }}" -d project; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ steps.info.outputs.chatid }}" \
              -d text="Не удалось распаковать архив."
            exit 1
          fi
          if [ ! -f project/jni/Android.mk ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ steps.info.outputs.chatid }}" \
              -d text="В архиве не найдена папка jni/Android.mk."
            exit 1
          fi

      - name: Run ndk-build
        working-directory: project
        run: |
          "${{ steps.setup-ndk.outputs.ndk-path }}/ndk-build" -j"$(nproc)" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            APP_ABI="arm64-v8a armeabi-v7a"

      - name: Package libs.zip
        working-directory: project/libs
        run: zip -r ../../libs.zip .

      - name: Send result to user
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ steps.info.outputs.chatid }}" \
            -d text="Готово! Библиотеки во вложении."
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F chat_id="${{ steps.info.outputs.chatid }}" \
            -F document=@libs.zip

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ steps.info.outputs.chatid }}" \
            -d text="Ошибка сборки. Проверь Android.mk и структуру архива (нужна jni/Android.mk)."
